<svg xmlns="http://www.w3.org/2000/svg" width="800" height="800" viewBox="0 0 800 800">
  <!-- Logo B — "Kulak-soru": kulak kıvrımı aynı zamanda bir soru işareti; noktası kırmızı. -->
  <defs>
    <radialGradient id="parilti" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#FF2E3B" stop-opacity="0.18"/>
      <stop offset="0.6" stop-color="#FF2E3B" stop-opacity="0.04"/>
      <stop offset="1" stop-color="#0A0A0D" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="800" height="800" fill="#0A0A0D"/>
  <circle cx="400" cy="420" r="340" fill="url(#parilti)"/>
  <!-- dış kıvrım (heliks) = soru işaretinin gövdesi -->
  <path d="M262 360 C 250 230 340 160 420 160 C 520 160 580 235 575 320 C 570 400 505 430 470 470 C 440 505 432 530 432 575"
        fill="none" stroke="#EDE6D6" stroke-width="58" stroke-linecap="round" stroke-linejoin="round"/>
  <!-- iç kıvrım (antiheliks) -->
  <path d="M352 330 C 352 280 390 250 425 252 C 470 255 492 295 478 335"
        fill="none" stroke="#EDE6D6" stroke-width="34" stroke-linecap="round"/>
  <!-- kulak kanalı = soru noktası -->
  <circle cx="432" cy="660" r="40" fill="#FF2E3B"/>
</svg>
