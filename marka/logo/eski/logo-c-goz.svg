    <line x1="262" y1="330" x2="262" y2="470"/>
    <line x1="324" y1="300" x2="324" y2="500"/>
    <line x1="476" y1="300" x2="476" y2="500"/>
    <line x1="538" y1="330" x2="538" y2="470"/>
    <line x1="600" y1="370" x2="600" y2="430"/>
  </g>
  <path d="M120 400 C 220 230 580 230 680 400 C 580 570 220 570 120 400 Z" fill="none" stroke="#EDE6D6" stroke-width="34" stroke-linejoin="round"/>
  <path d="M400 255 C 440 320 440 480 400 545 C 360 480 360 320 400 255 Z" fill="#FF2E3B"/>
