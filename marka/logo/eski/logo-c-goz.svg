    <clipPath id="goz">
      <path d="M120 400 C 220 230 580 230 680 400 C 580 570 220 570 120 400 Z"/>
    </clipPath>
    <radialGradient id="parilti" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#FF2E3B" stop-opacity="0.22"/>
      <stop offset="1" stop-color="#0A0A0D" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="800" height="800" fill="#0A0A0D"/>
  <circle cx="400" cy="400" r="300" fill="url(#parilti)"/>
  <g clip-path="url(#goz)" stroke="#EDE6D6" stroke-width="30" stroke-linecap="round" opacity="0.9">
