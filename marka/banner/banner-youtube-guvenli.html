<!doctype html>
<!--
  banner-youtube.html — YouTube kanal banner'ı (2560x1440).
  Render: node araclar/marka_render.js marka/banner/banner-youtube.html marka/banner/banner-youtube.png 2560 1440
  Güvenli alan kontrolü için adrese ?guvenli eklenmiş kopya: banner-youtube-guvenli.html
  Tüm yazı ve logo, ortadaki 1546x423 güvenli alanın içinde kalmalı (tüm cihazlarda görünen kısım).
-->
<html lang="tr"><head><title>guvenli</title><meta charset="utf-8">
<style>
  @font-face { font-family: 'Anton'; src: url('../fontlar/Anton-Regular.ttf'); }
  @font-face { font-family: 'Inter'; src: url('../fontlar/Inter[opsz,wght].ttf'); font-weight: 100 900; }
  :root { --gece:#0A0A0D; --kemik:#EDE6D6; --sinyal:#FF2E3B; --kul:#6B6A72; }
  html,body { margin:0; width:2560px; height:1440px; overflow:hidden; background:var(--gece); }
  #dalga { position:absolute; inset:0; }
  .vinyet { position:absolute; inset:0;
    background: radial-gradient(ellipse 60% 45% at 50% 50%, rgba(255,46,59,0.16), rgba(10,10,13,0) 60%),
                radial-gradient(ellipse at 50% 50%, rgba(10,10,13,0) 40%, rgba(10,10,13,0.92) 100%); }
  .gren { position:absolute; inset:0; opacity:.10; mix-blend-mode:screen; }
  .icerik { position:absolute; left:507px; top:508px; width:1546px; height:423px;
    display:flex; align-items:center; justify-content:center; gap:44px; }
  .icerik img { width:210px; height:210px; border-radius:50%; box-shadow:0 0 80px rgba(255,46,59,.25); }
  .metin { display:flex; flex-direction:column; gap:14px; text-shadow:0 0 18px #0A0A0D, 0 0 36px #0A0A0D; }
  h1 { margin:0; font-family:'Anton'; font-weight:400; font-size:168px; line-height:.95; letter-spacing:5px; color:var(--kemik); }
  h1 span { color:var(--sinyal); }
  p { margin:0; font-family:'Inter'; font-weight:600; font-size:31px; letter-spacing:1px; color:var(--kemik); opacity:.86; }
  p.alt { font-weight:600; font-size:25px; color:#B4B0B8; opacity:1; letter-spacing:3px; text-transform:uppercase; }
  .guvenli { position:absolute; left:507px; top:508px; width:1546px; height:423px; outline:4px dashed #0f0; display:none; }
</style></head>
<body>
  <canvas id="dalga" width="2560" height="1440"></canvas>
  <svg class="gren" width="2560" height="1440"><filter id="g"><feTurbulence type="fractalNoise" baseFrequency=".9" numOctaves="2" seed="7"/></filter><rect width="100%" height="100%" filter="url(#g)"/></svg>
  <div class="vinyet"></div>
  <div class="icerik">
    <img src="../logo/logo-a-dalga-800.png" alt="">
    <div class="metin">
      <h1>DUYMA <span>SAKIN</span></h1>
      <p>Kısa korku hikâyeleri · Şehir efsaneleri · Açıklanamayan olaylar</p>
      <p class="alt">Kulaklığını tak. Işığı kapatma.</p>
    </div>
  </div>
  <div class="guvenli"></div>
<script>
  if (location.search.includes('guvenli') || document.title === 'guvenli') document.querySelector('.guvenli').style.display = 'block';
  // Tohumlu rastgele: her render aynı dalgayı çizer.
  let t = 1337; const r = () => (t = (t * 16807) % 2147483647) / 2147483647;
  const c = document.getElementById('dalga').getContext('2d');
  const W = 2560, H = 1440, orta = H / 2, adim = 22;
  for (let x = 11; x < W; x += adim) {
    const uzak = Math.abs(x - W / 2) / (W / 2);           // 0 merkez, 1 kenar
    const zarf = Math.pow(1 - uzak, 1.6);
    const h = 18 + (zarf * 420 + 40) * (0.35 + 0.65 * r());
    c.strokeStyle = `rgba(237,230,214,${0.05 + 0.13 * zarf})`;
    c.lineWidth = 9; c.lineCap = 'round';
    c.beginPath(); c.moveTo(x, orta - h / 2); c.lineTo(x, orta + h / 2); c.stroke();
  }
</script>
</body></html>
